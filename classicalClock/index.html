<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="clock">

        <!-- Roman Numerals -->
        <div class="number n12">XII</div>
        <div class="number n3">III</div>
        <div class="number n6">VI</div>
        <div class="number n9">IX</div>

        <!-- Clock Hands -->
        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>

        <!-- Center -->
        <div class="center"></div>

    </div>
    <script src="script.js"></script>
</body>
</html>
